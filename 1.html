<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Média Acadêmica</title>

</head>
<body>

    <h2>Calculadora de Media Academica</h2>

    <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite o nome do aluno">
    </div>

    <div class="form-group">
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" step="0.1" placeholder="Digite a primeira nota">
    </div>

    <div class="form-group">
        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" placeholder="Digite a segunda nota">
    </div>

    <button id="botaocalcular">Calcular</button>

    <div id="resultado"></div>

    <script>
        const botaoCalcular = document.getElementById('botaocalcular');

        botaoCalcular.addEventListener('click', function() {

            const nome = document.getElementById('nome').value;
            const nota1 = parseFloat(document.getElementById('nota1').value);
            const nota2 = parseFloat(document.getElementById('nota2').value);

            const media = (nota1 + nota2) / 2;

            const divResultado = document.getElementById('resultado');
            divResultado.textContent = `${nome} - ${media.toFixed(2)}`;
        });
    </script>

</body>
</html>
